# Force the Cucumber engine to find features at the root classpath folder
#cucumber.features=classpath:features
cucumber.features=src/test/resources/features
cucumber.filter.tags=@draft

# Optional: Add your glue paths here too if you want to keep your Java runner even cleaner
cucumber.glue=github.gravitydevelopment.steps,github.gravitydevelopment.hooks

# Optional: Enable readable console plugin printing to verify step execution
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json